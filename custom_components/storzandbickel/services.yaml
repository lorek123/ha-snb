run_analysis:
  name: Run analysis
  description: >-
    Run the device's on-board diagnostics and return a report: overall status,
    heuristic warnings, detected error flags, and raw register/history values.
    Per-bit error meanings are decoded by Storz & Bickel's servers, so the
    report flags which error bits are set rather than naming each cause.
  target:
    entity:
      integration: storzandbickel
      domain: climate

run_workflow:
  name: Run workflow
  description: >-
    Run a custom Volcano workflow: a sequence of timed heat-and-pump steps. Each
    step sets a temperature, optionally waits for it, holds, then runs the pump.
    Blocks until the sequence completes; watch the climate and air-pump entities
    for progress. Volcano only.
  target:
    entity:
      integration: storzandbickel
      domain: climate
  fields:
    steps:
      name: Steps
      description: >-
        Ordered list of steps. Each item: temperature (°C, required) plus
        optional hold_seconds (default 0) and pump_seconds (default 5).
      required: true
      example: |
        - temperature: 185
          hold_seconds: 10
          pump_seconds: 8
        - temperature: 200
          pump_seconds: 12
      selector:
        object:
