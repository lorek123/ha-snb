[project]
name = "ha-snb"
version = "0.1.15"
description = "Home Assistant custom integration for Storz & Bickel vaporizers via Bluetooth"
readme = "README.md"
requires-python = ">=3.14.2"
dependencies = [
    "storzandbickel-ble>=0.1.9",
]

[project.optional-dependencies]
# Runtime deps are only storzandbickel-ble; tests need HA + bluetooth models for fixtures.
test = [
    "pytest>=9.0.3",
    "pytest-asyncio>=0.21.0",
    "pytest-cov>=7.1.0",
    "pytest-homeassistant-custom-component>=0.13.339",
    "home-assistant-bluetooth>=2.0.0",
    "serialx==1.8.0",
]
# Static typing (also installed in CI).
dev = [
    "pyright>=1.1.410",
]

[tool.pyright]
include = ["custom_components/storzandbickel"]
pythonVersion = "3.14"
typeCheckingMode = "basic"
