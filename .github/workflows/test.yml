name: Tests

on:
  push:
    branches: [ main, master ]
  pull_request:
    branches: [ main, master ]

jobs:
  test:
    runs-on: ubuntu-latest
    strategy:
      matrix:
        # Keep in sync with requires-python in pyproject.toml (Home Assistant 2026+ target).
        python-version: ["3.14"]

    steps:
    - uses: actions/checkout@v7

    # uv installs Python when needed; do not `pip install -e .` — editable installs
    # register custom_components on a setuptools path hook that is not a real directory,
    # which breaks homeassistant.loader's Path(custom_components.__path__).iterdir().
    - uses: astral-sh/setup-uv@v7
      with:
        python-version: ${{ matrix.python-version }}

    - name: Install dependencies
      run: uv sync --extra test --extra dev --no-install-project

    - name: Run pyright
      run: uv run pyright custom_components/storzandbickel

    - name: Run tests
      env:
        PYTHONPATH: ${{ github.workspace }}
      run: uv run pytest --cov=custom_components/storzandbickel --cov-report=xml --cov-report=term

    # The integration targets HA 2026.11 (hacs.json), but the newest
    # pytest-homeassistant-custom-component still pins 2026.10, so tests run on
    # that. Type-check against the real target too. Drop this step once the
    # harness ships a 2026.11 release and the lockfile moves to it.
    - name: Run pyright against the target Home Assistant
      run: |
        uv pip install homeassistant==2026.11.1
        uv run --no-sync pyright custom_components/storzandbickel

    - name: Upload coverage
      uses: codecov/codecov-action@v7
      with:
        file: ./coverage.xml
        flags: unittests
        name: codecov-umbrella
