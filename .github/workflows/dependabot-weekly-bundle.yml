# Combines multiple open Dependabot PRs that already have green CI into a single
# weekly PR against the default branch. Reduces review overhead while only
# bundling PRs that pass checks (pending or failing PRs are left untouched).
#
# Configure: default branch must match the base used in your repo (default: main).
name: Weekly Dependabot bundle

on:
  schedule:
    # Mondays 07:15 UTC — adjust if you want a different weekly window
    - cron: "15 7 * * 1"
  workflow_dispatch:

concurrency:
  group: dependabot-weekly-bundle
  cancel-in-progress: false

permissions:
  contents: write
  pull-requests: write

jobs:
  bundle:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout default branch
        uses: actions/checkout@v7
        with:
          fetch-depth: 0
          ref: main

      # Needed to regenerate uv.lock after bundling — merged lock files are
      # discarded in favour of one clean resolve.
      - uses: astral-sh/setup-uv@v7

      - name: Bundle passing Dependabot PRs
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          BASE_BRANCH: main
        shell: bash
        run: |
          set -euo pipefail

          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"

          existing_bundle="$(
            gh pr list --repo "${{ github.repository }}" -B "${BASE_BRANCH}" -s open \
              --json headRefName \
              --jq 'map(select(.headRefName | test("^dependabot/weekly-bundle-"))) | length'
          )"
          if [[ "${existing_bundle:-0}" -gt 0 ]]; then
            echo "An open PR from dependabot/weekly-bundle-* already exists; skipping."
            exit 0
          fi

          raw="$(gh pr list --repo "${{ github.repository }}" -B "${BASE_BRANCH}" -s open \
            --app dependabot -L 50 --json number,headRefName,title)"

          mapfile -t nums < <(echo "$raw" | jq -r 'sort_by(.number) | .[].number')
          if [[ ${#nums[@]} -eq 0 ]]; then
            echo "No open Dependabot PRs; nothing to do."
            exit 0
          fi

          green=()
          for n in "${nums[@]}"; do
            set +e
            gh pr checks "$n" --repo "${{ github.repository }}" >/dev/null 2>&1
            rc=$?
            set -e
            if [[ $rc -eq 0 ]]; then
              green+=("$n")
            elif [[ $rc -eq 8 ]]; then
              echo "PR #${n}: checks still pending; skipping."
            else
              echo "PR #${n}: checks not all passing (exit ${rc}); skipping."
            fi
          done

          if [[ ${#green[@]} -lt 2 ]]; then
            echo "Fewer than two Dependabot PRs with all checks passing (${#green[@]}); no bundle created."
            exit 0
          fi

          bundle_branch="dependabot/weekly-bundle-$(date -u +%Y%m%d)"
          git checkout -b "${bundle_branch}" "origin/${BASE_BRANCH}"

          body=$'Weekly rollup of Dependency updates (all included PRs had green CI when this branch was built).\n\n**Included PRs:**\n'
          merged=()
          for n in "${green[@]}"; do
            title="$(echo "$raw" | jq -r --argjson num "$n" '.[] | select(.number == $num) | .title')"
            echo "Merging #${n}: ${title}"
            head_ref="$(echo "$raw" | jq -r --argjson num "$n" '.[] | select(.number == $num) | .headRefName')"
            git fetch origin "${head_ref}"
            if git merge --no-ff "origin/${head_ref}" \
              -m "chore(deps): merge dependency updates from #${n}"; then
              merged+=("$n")
              body+="- #${n} — ${title}"$'\n'
              continue
            fi

            # Every Dependabot PR touches uv.lock, so lock conflicts are the norm rather
            # than the exception once more than one PR is open — bailing out here is why
            # this job could never succeed. Take the base lock and regenerate it once at
            # the end from the merged pyproject.toml. Anything else conflicting is a real
            # conflict: skip that PR and carry on with the rest.
            conflicted="$(git diff --name-only --diff-filter=U)"
            if [[ "${conflicted}" == "uv.lock" ]]; then
              echo "PR #${n}: uv.lock conflict only; deferring the lock and continuing."
              git checkout --ours -- uv.lock
              git add uv.lock
              git commit -m "chore(deps): merge dependency updates from #${n} (uv.lock deferred)"
              merged+=("$n")
              body+="- #${n} — ${title}"$'\n'
            else
              echo "::warning::Skipping #${n} (${head_ref}); conflicts in: ${conflicted:-unknown}"
              git merge --abort || true
            fi
          done

          if [[ ${#merged[@]} -lt 2 ]]; then
            echo "Fewer than two PRs merged cleanly (${#merged[@]}); no bundle created."
            exit 0
          fi

          # Regenerate the lock once, from the union of all merged pyproject.toml changes.
          uv lock
          git add uv.lock
          git diff --staged --quiet \
            || git commit -m "chore(deps): regenerate uv.lock after bundling"

          git push origin "${bundle_branch}"

          title="chore(deps): weekly dependency bundle ($(date -u +%Y-%m-%d))"
          gh pr create --repo "${{ github.repository }}" \
            -B "${BASE_BRANCH}" \
            -H "${bundle_branch}" \
            --title "${title}" \
            --body "${body}"

          pr_num="$(
            gh pr list --repo "${{ github.repository }}" -B "${BASE_BRANCH}" -H "${bundle_branch}" \
              --json number --jq '.[0].number'
          )"
          # Only close what actually made it into the bundle — PRs skipped for real
          # conflicts must stay open.
          for n in "${merged[@]}"; do
            gh pr close "$n" --repo "${{ github.repository }}" \
              -c "Superseded by weekly bundle #${pr_num}."
          done
