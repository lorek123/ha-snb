name: Auto Release

on:
  push:
    branches: [main]
    paths:
      - 'custom_components/storzandbickel/manifest.json'

permissions:
  contents: write

env:
  FORCE_JAVASCRIPT_ACTIONS_TO_NODE24: true

jobs:
  release:
    name: Create release if version changed
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7

      - name: Read version from manifest
        id: version
        run: |
          VERSION=$(jq -r '.version' custom_components/storzandbickel/manifest.json)
          echo "version=$VERSION" >> "$GITHUB_OUTPUT"

      - name: Skip if release already exists
        id: check
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          if gh release view "v${{ steps.version.outputs.version }}" \
               --repo "${{ github.repository }}" &>/dev/null; then
            echo "exists=true"  >> "$GITHUB_OUTPUT"
          else
            echo "exists=false" >> "$GITHUB_OUTPUT"
          fi

      - name: Create GitHub release
        if: steps.check.outputs.exists == 'false'
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          gh release create "v${{ steps.version.outputs.version }}" \
            --title "Release v${{ steps.version.outputs.version }}" \
            --generate-notes \
            --repo "${{ github.repository }}"
